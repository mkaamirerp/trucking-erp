name: DL Sandbox Production Reset Apply

on:
  push:
    branches:
      - feature/dl-sandbox-production-reset
    paths:
      - '.github/workflows/dl_reset_apply.yml'

permissions:
  contents: write

jobs:
  apply-reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dl-sandbox-production-reset
          fetch-depth: 0

      - name: Apply DL reset wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path('apps/web/src/pages/OnboardingApplicantPage.tsx')
          text = page.read_text()
          pattern = r'  async function handleCorrectedDl\(.*?\n  \}\n\n  async function resetSavedDraft'
          replacement = '''  async function handleDlUpload(side: "front" | "back", file: File): Promise<boolean> {
            const docType: DocType = side === "front" ? "CDL_FRONT" : "CDL_BACK";
            return uploadDl(docType, file);
          }

          async function resetSavedDraft'''
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one handleCorrectedDl block, replaced {count}')
          text, count = text.replace('onConfirmSide={handleCorrectedDl}', 'onUploadSide={handleDlUpload}', 1), text.count('onConfirmSide={handleCorrectedDl}')
          if count != 1:
              raise SystemExit(f'expected one old DL callback, found {count}')
          page.write_text(text)

          router = Path('app/routers/driver_onboarding.py')
          text = router.read_text()
          if 'import asyncio\n' not in text:
              text = text.replace('import copy\n', 'import asyncio\nimport copy\nimport io\n', 1)
          if '    get_storage,\n' not in text:
              text = text.replace('from app.core.storage import (\n', 'from app.core.storage import (\n    get_storage,\n', 1)
          anchor = 'from app.services.applicant_dl_pdf417 import apply_stored_cdl_back_pdf417\n'
          if 'applicant_dl_sandbox_preprocessing' not in text:
              if anchor not in text:
                  raise SystemExit('PDF417 import anchor missing')
              text = text.replace(anchor, anchor + 'from app.services.applicant_dl_sandbox_preprocessing import preprocess_driver_license_bytes\n', 1)

          route_pattern = r'''    stored = await save_applicant_dl_upload\(tenant_slug, app\.id, file\)\n.*?    if doc_type == "CDL_BACK":\n        intake = await apply_stored_cdl_back_pdf417\(intake, stored\.storage_key, tenant_slug\)'''
          route_replacement = '''    # Canonical evidence: save the user's original upload unchanged first.
              stored = await save_applicant_dl_upload(tenant_slug, app.id, file)
              raw_bytes = get_storage().read_bytes(stored.storage_key, "applicant_dl", tenant_slug)

              # Exact successful sandbox four-corner algorithm. No four corners = no derivative.
              preprocessed = await asyncio.to_thread(preprocess_driver_license_bytes, raw_bytes)
              processed_stored = None
              if preprocessed.processed_jpeg is not None:
                  processed_upload = UploadFile(
                      file=io.BytesIO(preprocessed.processed_jpeg),
                      filename="dl_processed.jpg",
                  )
                  processed_stored = await save_applicant_dl_upload(tenant_slug, app.id, processed_upload)

              effective_key = processed_stored.storage_key if processed_stored is not None else stored.storage_key
              intake = dict(app.intake_payload or {})
              files = dict(intake.get("files") or {})
              files[doc_type] = {
                  "storage_key": stored.storage_key,
                  "file_id": stored.storage_key,
                  "enh_file_id": effective_key,
                  "original_filename": stored.original_filename,
                  "upload_status": "READY",
                  "preprocess_status": preprocessed.status,
                  "preprocess_diagnostics": preprocessed.diagnostics,
              }
              intake["files"] = files
              if doc_type == "CDL_BACK":
                  intake = await apply_stored_cdl_back_pdf417(intake, effective_key, tenant_slug)'''
          text, count = re.subn(route_pattern, route_replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one DL upload storage/PDF417 block, replaced {count}')
          router.write_text(text)

          for filename in ('requirements.in', 'requirements.txt'):
              path = Path(filename)
              contents = path.read_text()
              if 'opencv-python-headless==' not in contents:
                  anchor = 'pyzbar==0.1.9\n'
                  if anchor not in contents:
                      raise SystemExit(f'{filename}: pyzbar anchor missing')
                  contents = contents.replace(anchor, anchor + 'numpy==2.2.6\nopencv-python-headless==4.11.0.86\n', 1)
              path.write_text(contents)

          lock = Path('requirements.lock.txt')
          contents = lock.read_text()
          if 'numpy==2.2.6' not in contents:
              anchor = 'markupsafe==3.0.3\n    # via mako\n'
              if anchor not in contents:
                  raise SystemExit('requirements.lock numpy anchor missing')
              contents = contents.replace(anchor, anchor + 'numpy==2.2.6\n    # via\n    #   -r requirements.in\n    #   opencv-python-headless\n', 1)
          if 'opencv-python-headless==4.11.0.86' not in contents:
              anchor = 'packaging==26.2\n    # via pytest\n'
              if anchor not in contents:
                  raise SystemExit('requirements.lock opencv anchor missing')
              contents = contents.replace(anchor, anchor + 'opencv-python-headless==4.11.0.86\n    # via -r requirements.in\n', 1)
          lock.write_text(contents)

          for filename in (
              'app/services/driver_id_preprocessing.py',
              'docs/archive/driver_onboarding/DRIVER_ID_PREPROCESSING_LINE_INTERSECTION.md',
          ):
              path = Path(filename)
              if path.exists():
                  path.unlink()
          PY

      - name: Verify reset shape
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "driverLicensePreprocessor\|DLCornerTool\|handleCorrectedDl" apps/web/src app --exclude-dir=node_modules
          grep -q "preprocess_driver_license_bytes" app/routers/driver_onboarding.py
          grep -q "onUploadSide={handleDlUpload}" apps/web/src/pages/OnboardingApplicantPage.tsx
          python -m py_compile app/services/applicant_dl_sandbox_preprocessing.py app/routers/driver_onboarding.py
          git diff --check
          git status --short

      - name: Commit reset
        shell: bash
        run: |
          git config user.name 'mkaamirerp'
          git config user.email 'mkaamir@gmail.com'
          git add -A
          git commit -m 'reset(dl): replace processing stack with proven sandbox algorithm'
          git push origin HEAD:feature/dl-sandbox-production-reset
