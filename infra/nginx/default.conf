server {
    listen 80;

    # Keep wildcard for tenant subdomains, but explicitly include common names too
    server_name truckerp.me www.truckerp.me api.truckerp.me *.truckerp.me;

    # --- Let's Encrypt HTTP-01 challenge files ---
    location ^~ /.well-known/acme-challenge/ {
        # certbot will write challenge files into this folder
        root /var/www/certbot;
        try_files $uri =404;
        default_type "text/plain";
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;

    # Keep wildcard for tenant subdomains, but explicitly include common names too
    server_name truckerp.me www.truckerp.me api.truckerp.me *.truckerp.me;

    ssl_certificate /etc/letsencrypt/live/truckerp.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/truckerp.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Serve built Vite app
    root /usr/share/nginx/html;
    index index.html;

    # Backend API proxy (internal Docker network only)
    location /api/ {
        proxy_pass http://truckerp-api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ensure SPA shell is not cached so new bundles are picked up
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # All other routes -> SPA
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
