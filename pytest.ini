[pytest]
# asyncio_* keys are registered by pytest-asyncio. For manual pytest in a host venv
# (verification only; does not change deployment mode), install pytest-asyncio or you get
# "Unknown config option" warnings — e.g. pip install pytest-asyncio==1.3.0 (pins in requirements-dev.txt).
asyncio_mode = auto
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
