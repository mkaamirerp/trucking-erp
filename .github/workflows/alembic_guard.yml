name: Alembic Guardrails

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  alembic-safety:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install base tools
        run: |
          python -m pip install --upgrade pip
          pip install alembic
          if ! command -v rg &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi

      - name: Install project dependencies
        run: |
          if [ -f requirements.lock.txt ]; then pip install -r requirements.lock.txt; fi

      - name: Check Alembic templates exist
        run: |
          test -f alembic/script.py.mako || (echo "Missing alembic/script.py.mako" && exit 1)
          test -f alembic_tenant/script.py.mako || (echo "Missing alembic_tenant/script.py.mako" && exit 1)
          echo "Alembic templates present"

      - name: Validate Alembic structure
        run: |
          test -d alembic/versions || (echo "Missing alembic/versions" && exit 1)
          test -d alembic_tenant/versions || (echo "Missing alembic_tenant/versions" && exit 1)
          test -f alembic/env.py || (echo "Missing alembic/env.py" && exit 1)
          test -f alembic_tenant/env.py || (echo "Missing alembic_tenant/env.py" && exit 1)
          test -f alembic.ini || (echo "Missing alembic.ini" && exit 1)
          test -f alembic_tenant.ini || (echo "Missing alembic_tenant.ini" && exit 1)
          echo "Alembic structure valid"

      - name: Check Alembic down_revision
        run: |
          chmod +x scripts/ci_check_alembic_down_revision.sh
          bash scripts/ci_check_alembic_down_revision.sh

      - name: Check platform/tenant revision id separation
        run: |
          chmod +x scripts/ci_check_alembic_platform_tenant_ids.sh
          bash scripts/ci_check_alembic_platform_tenant_ids.sh

      - name: Check single head (platform)
        run: |
          OUT=$(python -m alembic -c alembic_platform.ini heads 2>&1)
          HEAD_COUNT=$(echo "$OUT" | grep -c "(head)" || echo "0")
          HEAD_COUNT=$(echo "$HEAD_COUNT" | xargs)
          if [ "$HEAD_COUNT" != "1" ]; then
            echo "Platform Alembic must have exactly one head (found: $HEAD_COUNT)"
            echo "$OUT"
            exit 1
          fi
          echo "Platform Alembic single head: $OUT"

      - name: Check single head (tenant)
        run: |
          OUT=$(python -m alembic -c alembic_tenant.ini heads 2>&1)
          HEAD_COUNT=$(echo "$OUT" | grep -c "(head)" || echo "0")
          HEAD_COUNT=$(echo "$HEAD_COUNT" | xargs)
          if [ "$HEAD_COUNT" != "1" ]; then
            echo "Tenant Alembic must have exactly one head (found: $HEAD_COUNT)"
            echo "$OUT"
            exit 1
          fi
          echo "Tenant Alembic single head: $OUT"

      - name: Python compile check
        run: |
          python -m compileall -q alembic/versions alembic_tenant/versions
          echo "Revision files compile"

      - name: Guard platform revisions
        run: |
          # Canonical platform DDL lives under alembic_platform/versions (alembic_platform.ini).
          # Legacy alembic/versions may retain historical tenant-shaped migrations; do not use it for this guard.
          if rg -n --hidden --no-ignore-vcs "op\.(create_table|drop_table|add_column|drop_column|create_foreign_key|create_index|drop_index|add_constraint|drop_constraint|alter_table|batch_alter_table)\s*\(\s*[\"'](drivers|loads|dispatch|payroll|settlements|hos|eld|equipment|trailers)" alembic_platform/versions 2>/dev/null; then
            echo "Platform migrations appear to touch tenant business tables"
            exit 1
          fi
          # Check for ForeignKey references to tenant tables
          if rg -n --hidden --no-ignore-vcs "ForeignKey\s*\([\"'](drivers|loads|dispatch|payroll|settlements|hos|eld|equipment|trailers)\." alembic_platform/versions 2>/dev/null; then
            echo "Platform migrations appear to reference tenant business tables via ForeignKey"
            exit 1
          fi
          echo "Platform revisions look platform-only"

      - name: Guard tenant revisions
        run: |
          if rg -n --hidden --no-ignore-vcs "(platform_tenants|platform_users|platform_subscriptions|reserved_slugs|plan_features|platform_)\b" alembic_tenant/versions 2>/dev/null; then
            echo "Tenant migrations appear to touch platform control-plane tables"
            exit 1
          fi
          echo "Tenant revisions look tenant-only"

      - name: Guard forbid alembic stamp
        run: |
          # Docs may document recovery commands; enforce only on automation / config paths.
          if rg -n --hidden --no-ignore-vcs -g '!.github/workflows/*.yml' "\balembic\b.*\bstamp\b|\bstamp\b.*\balembic\b" scripts tools .github 2>/dev/null; then
            echo "Found alembic stamp usage in repo scripts/tools/.github"
            exit 1
          fi
          echo "No committed alembic stamp usage found"
