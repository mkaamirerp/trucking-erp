services:
  truckerp-postgres:
    image: postgres:15.7-alpine
    container_name: truckerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trucking_erp
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - truckerp_net

  truckerp-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: truckerp-api
    restart: unless-stopped
    depends_on:
      - truckerp-postgres
    command: ["/bin/sh", "-lc", "/app/scripts/start_api_with_ssm.sh"]
    environment:
      BASE_DOMAIN: truckerp.me
      COOKIE_DOMAIN: .truckerp.me
      SECURE_COOKIES: "false"
    tmpfs:
      - /run/secrets
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c 'import urllib.request,sys; data=urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health",timeout=2).read().decode(); sys.exit(0 if "\"status\":\"ok\"" in data else 1)'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - truckerp_net

  truckerp-nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    container_name: truckerp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - truckerp-api
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/error-pages:/usr/share/nginx/error-pages:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - truckerp_net

  certbot:
    image: certbot/certbot:latest
    container_name: truckerp-certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h;
      done'

volumes:
  postgres_data:
  letsencrypt:
  certbot_www:

networks:
  truckerp_net:
    external: true
