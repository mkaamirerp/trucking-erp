server {
    listen 80;

    # Keep wildcard for tenant subdomains, but explicitly include common names too
    server_name truckerp.me www.truckerp.me api.truckerp.me *.truckerp.me;

    # --- Let's Encrypt HTTP-01 challenge files ---
    location ^~ /.well-known/acme-challenge/ {
        # certbot will write challenge files into this folder
        root /var/www/certbot;
        try_files $uri =404;
        default_type "text/plain";
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;

    # Keep wildcard for tenant subdomains, but explicitly include common names too
    server_name truckerp.me www.truckerp.me api.truckerp.me *.truckerp.me;

    ssl_certificate /etc/letsencrypt/live/truckerp.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/truckerp.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Serve built Vite app
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Friendly page when API/upstream is unreachable (avoid raw nginx HTML)
    error_page 502 503 504 /error-pages/50x.html;

    # Docker embed DNS — re-resolve API hostname after container recreate (avoids stale IP 502s)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ^~ /error-pages/ {
        internal;
        alias /usr/share/nginx/error-pages/;
    }

    # Backend API proxy (internal Docker network only)
    location /api/ {
        # Host:port only — full /api/... URI is forwarded (required when using variables + resolver)
        set $api_upstream truckerp-api:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_redirect off;  # preserve Location for OAuth callback → tenant subdomain redirect
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Ensure SPA shell is not cached so new bundles are picked up
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # All other routes -> SPA
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }
}
