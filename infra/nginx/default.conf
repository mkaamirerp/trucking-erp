server {
    listen 80;

    # Keep wildcard for tenant subdomains, but explicitly include common names too
    server_name truckerp.me www.truckerp.me api.truckerp.me *.truckerp.me;

    # --- Let's Encrypt HTTP-01 challenge files ---
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        default_type "text/plain";
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;

    # Required so browser-sent X-Platform-Admin-Key (underscore) is not dropped before proxy_pass
    underscores_in_headers on;

    # Keep wildcard for tenant subdomains, and explicitly include common names too
    server_name truckerp.me www.truckerp.me api.truckerp.me *.truckerp.me;

    ssl_certificate /etc/letsencrypt/live/truckerp.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/truckerp.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Serve built Vite app
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Friendly page when API/upstream is unreachable (avoid raw nginx HTML)
    error_page 502 503 504 /error-pages/50x.html;

    # Docker embed DNS — re-resolve API hostname after container recreate (avoids stale IP 502s)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ^~ /error-pages/ {
        internal;
        alias /usr/share/nginx/error-pages/;
    }

    # Backend API proxy (internal Docker network only)
    location /api/ {
        set $api_upstream truckerp-api:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Platform-Admin-Key $http_x_platform_admin_key;
        proxy_set_header X-TruckERP-Platform-Admin-Key $http_x_truckerp_platform_admin_key;
        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    #
    # --- SPA caching (production tenants; no hard-refresh required after deploy) ---
    #
    # 1) Vite emits hashed files under /assets/*. New deploy => new filenames => browsers fetch new files.
    #    Long-lived immutable cache is safe and reduces load.
    #
    # 2) index.html must never be served from cache without revalidation: it holds the only references
    #    to the current hashed bundles. no-store forces a fresh shell after nginx image updates.
    #
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    # Client-side routes, favicon, and other root files from dist
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
