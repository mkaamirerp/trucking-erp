name: DL Browser Validation

on:
  pull_request:
    paths:
      - 'apps/web/src/core/driverLicenseGeometry.ts'
      - 'apps/web/src/core/driverLicensePreprocessor.ts'
      - 'apps/web/src/core/driverLicenseGeometry.test.ts'
      - 'apps/web/src/components/DLUploadStep.tsx'
      - 'apps/web/src/pages/OnboardingApplicantPage.tsx'
      - 'apps/web/src/api.ts'
      - 'app/core/storage.py'
      - 'app/routers/driver_onboarding.py'
      - 'tests/test_applicant_dl_processed_storage.py'
      - '.github/workflows/dl_browser_validation.yml'

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test -- src/core/driverLicenseGeometry.test.ts
      - run: npm run build

  backend-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_applicant_dl_processed_storage.py
