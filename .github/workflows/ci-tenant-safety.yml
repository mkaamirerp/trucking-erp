name: Tenant Safety CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tenant-safety:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Install project dependencies (if present)
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi


      - name: Guard: tenant safety script must exist
        run: |
          test -f scripts/ci_tenant_safety.sh

      - name: Run tenant safety enforcement
        run: |
          chmod +x scripts/ci_tenant_safety.sh
          ./scripts/ci_tenant_safety.sh
