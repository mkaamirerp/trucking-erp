# Production-oriented memory caps for a 2 GiB t3.small host (non-Swarm):
# - postgres: 512m — shared_buffers is 128MB; observed RSS ~110Mi with ~20 backends.
# - API: 1280m — idle ~160Mi, historical OpenCV/DL ~750Mi; keep headroom, do not cut further.
# - nginx: 128m — observed ~7Mi; TLS reverse proxy.
# Sum of caps ~1.9Gi; leave RAM for Debian, dockerd, SSH, page cache.
# Tune per host RAM: leave headroom for OS + SSH (~20–30%). Override in a private overlay if needed.
x-logging: &json-file-rotate
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  truckerp-postgres:
    image: postgres:15.7-alpine
    container_name: truckerp-postgres
    restart: unless-stopped
    mem_limit: 512m
    logging: *json-file-rotate
    environment:
      POSTGRES_DB: trucking_erp
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - truckerp_net

  truckerp-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        # Optional: export TRUCKERP_APP_GIT_SHA="$(git rev-parse --short HEAD)" before build — .git is not in the image context.
        TRUCKERP_APP_GIT_SHA: ${TRUCKERP_APP_GIT_SHA:-}
    container_name: truckerp-api
    restart: unless-stopped
    mem_limit: 1280m
    logging: *json-file-rotate
    depends_on:
      - truckerp-postgres
    command: ["/bin/sh", "-lc", "/app/scripts/start_api_with_ssm.sh"]
    environment:
      SSM_ENV: prod
      BASE_DOMAIN: truckerp.me
      COOKIE_DOMAIN: .truckerp.me
      SECURE_COOKIES: "false"
      # Persist tenant uploads (DL, docs) across container recreate; mirrors paths under ./storage layout.
      LOCAL_STORAGE_DIR: /app/storage_persistent
    tmpfs:
      - /run/secrets
    # Internal port only — do not add `ports:` here; nginx reaches truckerp-api:8000 on truckerp_net.
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c 'import urllib.request,sys; data=urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health",timeout=2).read().decode(); sys.exit(0 if "\"status\":\"ok\"" in data else 1)'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - trucking_erp_storage:/app/storage_persistent
    networks:
      - truckerp_net

  truckerp-nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    container_name: truckerp-nginx
    restart: unless-stopped
    mem_limit: 128m
    logging: *json-file-rotate
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - truckerp-api
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/error-pages:/usr/share/nginx/error-pages:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - truckerp_net

  certbot:
    image: certbot/certbot:latest
    container_name: truckerp-certbot
    restart: unless-stopped
    mem_limit: 64m
    logging: *json-file-rotate
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h;
      done'

volumes:
  postgres_data:
  trucking_erp_storage:
  letsencrypt:
  certbot_www:

networks:
  truckerp_net:
    external: true
