# Dev-only overrides. Use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# DEV WILL NOT USE SSM.
# - API starts with uvicorn directly (no start_api_with_ssm.sh).
# - Secrets from .env only. Required: DATABASE_URL, POSTGRES_ADMIN_URL, POSTGRES_PASSWORD, JWT_SECRET.
# - No AWS credentials, no IAM, no Parameter Store. Zero cloud dependency.
#
# Prod (docker-compose.yml only) continues to use start_api_with_ssm.sh and SSM.

services:
  truckerp-api:
    env_file:
      - .env
    command: ["/bin/sh", "-c", "cd /app && alembic -c alembic_platform.ini upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    environment:
      TOOLS_DEV_PASSWORD: devtools123
      TOOLS_DEV_SECRET: devtools-secret-123
    volumes:
      - .:/app
  truckerp-nginx:
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
