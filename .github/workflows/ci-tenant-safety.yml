name: Tenant Safety CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tenant-safety:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Install project dependencies (if present)
        run: |
          if [ -f requirements.lock.txt ]; then pip install -r requirements.lock.txt; fi

      - name: "Guard: tenant safety script must exist"
        run: |
          test -f scripts/ci_tenant_safety.sh

      - name: Run tenant safety enforcement
        run: |
          chmod +x scripts/ci_tenant_safety.sh
          ./scripts/ci_tenant_safety.sh
