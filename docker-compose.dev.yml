# =============================================================================
# WARNING: LOCAL / ENGINEERING-MACHINE ONLY — NOT FOR INTERNET-FACING PRODUCTION
# =============================================================================
# - Publishes API port 8000 to the host (bypasses nginx; fails security audits).
# - Sets dev-oriented API behavior (e.g. SSM_ENV=dev, bind-mounts repo into /app).
# - Never use this file on the public server or any host where prod traffic lands.
#
# Public / production workflow: docker compose -f docker-compose.yml ONLY
#   See: .cursor/rules/rebuild-restart-commands.mdc, scripts/reload_api.sh
#
# Local iteration (your laptop / sandbox only):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# =============================================================================

services:
  truckerp-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8000:8000"
    environment:
      SSM_ENV: dev
      ENVIRONMENT: dev
      ALLOW_TENANT_RESOLUTION_SHORTCUTS: "true"
      # STORAGE_PROVIDER: s3
    volumes:
      # Mount repo so code changes apply on container restart (no image rebuild).
      # Python and site-packages remain from the image.
      - .:/app
    command: ["/bin/sh", "-lc", "/app/scripts/start_api_with_ssm.sh"]

  truckerp-nginx:
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/error-pages:/usr/share/nginx/error-pages:ro
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
