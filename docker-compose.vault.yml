services:
  truckerp-vault:
    image: hashicorp/vault:1.16
    container_name: truckerp-vault
    restart: unless-stopped
    command: ["vault", "server", "-config=/vault/config/vault.hcl"]
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault/config.hcl:/vault/config/vault.hcl:ro
      - ./vault/data:/vault/data
    ports:
      - "8200:8200"
    networks:
      - truckerp_net

  truckerp-vault-agent:
    image: hashicorp/vault:1.16
    container_name: truckerp-vault-agent
    restart: unless-stopped
    command: ["vault", "agent", "-config=/home/vault/agent/agent.hcl"]
    volumes:
      - ./infra/vault:/home/vault/agent:ro
      - ./infra/vault/truckerp.env.tpl:/home/vault/templates/truckerp.env.tpl:ro
      - ./runtime/vault:/home/vault/auth:ro
      - ./runtime/rendered:/home/vault/rendered_host
    networks:
      - truckerp_net

networks:
  truckerp_net:
    external: true
