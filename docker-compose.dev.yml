# Dev-only overrides. Use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Prod: image-only, no host mounts. Dev: host mounts allowed here only.
#
# In dev, API still uses AWS SSM via start_api_with_ssm.sh, but with SSM_ENV=dev.

services:
  truckerp-api:
    ports:
      - "8000:8000"
    environment:
      SSM_ENV: dev
      # STORAGE_PROVIDER: s3
    volumes:
      # Mount repo so code changes apply on container restart (no image rebuild).
      # Python and site-packages remain from the image.
      - .:/app
    command: ["/bin/sh", "-lc", "/app/scripts/start_api_with_ssm.sh"]

  truckerp-nginx:
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot