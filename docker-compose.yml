services:
  truckerp-postgres:
    image: postgres:15.7-alpine
    container_name: truckerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trucking_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - truckerp_net

  truckerp-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truckerp-api
    restart: unless-stopped
    depends_on:
      - truckerp-postgres
    command:
      [
        "/bin/sh",
        "-lc",
        "last_log=0; while [ ! -s /run/secrets/truckerp.env ]; do now=$$(date +%s); if [ $$((now - last_log)) -ge 10 ]; then echo \"Waiting for /run/secrets/truckerp.env\"; last_log=$$now; fi; sleep 1; done; set -a; . /run/secrets/truckerp.env; set +a; echo \"Loaded env from /run/secrets/truckerp.env\"; exec python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@truckerp-postgres:5432/trucking_erp
      POSTGRES_ADMIN_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@truckerp-postgres:5432/postgres
      TENANT_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@truckerp-postgres:5432/tenant_smoke_active
      BASE_DOMAIN: truckerp.me
      COOKIE_DOMAIN: .truckerp.me
      SECURE_COOKIES: "false"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
    volumes:
      - ./runtime/rendered:/run/secrets:ro
    networks:
      - truckerp_net

  truckerp-nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    container_name: truckerp-nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - truckerp-api
    networks:
      - truckerp_net

volumes:
  postgres_data:

networks:
  truckerp_net:
    external: true
